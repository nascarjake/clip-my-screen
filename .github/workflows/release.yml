name: Desktop releases

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  mac:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - name: Verify the packaged app starts paused without a recorder or login registration
        run: npm run validate:paused
      - uses: actions/upload-artifact@v4
        with:
          name: clip-my-screen-${{ matrix.runner }}
          path: |
            dist/Clip-My-Screen-macOS-*.dmg
            dist/Clip-My-Screen-macOS-*.zip
          if-no-files-found: error

  windows:
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - name: Verify the packaged app starts paused without a recorder or login registration
        run: npm run validate:paused
      - uses: actions/upload-artifact@v4
        with:
          name: clip-my-screen-windows
          path: |
            dist/Clip-My-Screen-Windows-*-Setup.exe
            dist/Clip-My-Screen-Windows-*-Portable.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag to the app version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-my-screen-*
          merge-multiple: true
          path: release
      - name: Verify all downloads and generate checksums
        working-directory: release
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt
      - name: Publish the tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --title "Clip My Screen ${GITHUB_REF_NAME}" --notes-file docs/release-notes.md
